name: Check flag status

# The whole backend. Free on public repos, forever. Every run rewrites
# status.json and commits it, so git history doubles as a permanent audit log
# of every status change — useful the first time someone insists you were
# wrong about a date.

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and can lag several
    # minutes under load, which is fine here. Don't go below 15 minutes; you
    # get throttled and gain nothing.
    - cron: '*/30 * * * *'
  workflow_dispatch:          # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - 'parsers.py'
      - 'run.py'
      - 'registry.json'
      - 'read_email.py'
      - 'test-parsers.py'
      - 'test-history.py'
      - 'render_fetch.py'

permissions:
  contents: write             # needed to commit status.json back

concurrency:
  # Two runs writing cache.json at once would corrupt it. Skip rather than stack.
  group: flag-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Parser tests
        # Offline and deterministic. If they fail, the parsers are broken and
        # nothing they produce should be published. These were never run in
        # CI, which is how the suite sat hung on one test without anyone
        # noticing.
        timeout-minutes: 2
        run: python3 test-parsers.py

      - name: Read notification emails
        # Push ingest for states that cannot be scraped. Never fails the job:
        # a mail outage must not block the states that are working. Email
        # states that stop hearing from their channel go stale on their own.
        # A failure here is reported by "Warn about failing sources" below —
        # continue-on-error alone shows it as a green check.
        id: mail
        continue-on-error: true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: python3 read_email.py

      # --- Rendered pages: MT, OK, SD -----------------------------------------
      # Three states serve nothing without JavaScript. A browser is slow and
      # fragile, so it is fenced off: every step here is continue-on-error, and
      # run.py treats a missing, failed or old snapshot exactly like a page
      # that would not load. The other states never depend on it. Snapshots
      # are cached between runs and re-rendered only when over 3 hours old,
      # so most runs install nothing and start no browser.
      - name: Rendered pages - restore snapshots
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: rendered
          key: rendered-none
          restore-keys: rendered-

      - name: Rendered pages - check which are due
        id: render-check
        continue-on-error: true
        run: python3 render_fetch.py --check

      - name: Rendered pages - restore browser
        if: steps.render-check.outputs.needed == 'true'
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium-headless-shell

      - name: Rendered pages - render
        id: render
        if: steps.render-check.outputs.needed == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          pip install playwright==1.63.0
          python3 -m playwright install --only-shell chromium
          python3 render_fetch.py

      - name: Rendered pages - save snapshots
        if: always() && steps.render-check.outputs.needed == 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: rendered
          key: rendered-${{ github.run_id }}

      - name: Check all sources
        # ANTHROPIC_API_KEY is optional: with it, a NEW order we cannot scope
        # by regex gets a second reading (extract.py). Without it the run is
        # regex-only and says so. Either way the model never decides half or
        # full - it extracts, our rules decide.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 run.py

      - name: Sanity-check before publishing
        id: sanity
        # Guard against publishing garbage. If coverage collapses, something
        # upstream broke — fail the job and keep the last good status.json.
        # Stale-but-correct beats fresh-and-wrong.
        run: |
          python3 - <<'PY'
          import json, sys
          s = json.load(open('status.json'))
          m = s['meta']
          print(f"covered={m['covered']} answered={m.get('answered')} "
                f"not_covered={m['not_covered']} stale={m['stale']} "
                f"frozen={m.get('frozen')} errors={m['errors']}")
          if m['covered'] < 20:
              sys.exit(f"REFUSING TO PUBLISH: only {m['covered']} states covered "
                       f"(expected ~39). Keeping the previous status.json.")
          if not s.get('states'):
              sys.exit("REFUSING TO PUBLISH: no states in output.")
          PY

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name  "flag-bot"
          git config user.email "flag-bot@users.noreply.github.com"
          # Add only the generated files that actually exist — not all of
          # them are produced on every run, and a bare `git add` of a missing
          # path aborts the whole step with exit 128.
          for f in status.json cache.json history.jsonl email-orders.json; do
            [ -f "$f" ] && git add "$f" || true
          done

          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "status: $(date -u '+%Y-%m-%d %H:%M UTC')"

          # These files are REGENERATED every run, so they must never be
          # merged. A previous `git pull --rebase` tried to reconcile two
          # versions of status.json and wrote conflict markers into it, which
          # then got committed and served as the live data file.
          #
          # There is nothing to reconcile: the newest run is authoritative.
          # `-X ours` resolves every conflict in favour of what we just
          # generated, and real code changes still merge normally.
          # A push that never succeeded used to exit 0 anyway. That made
          # "published" and "tried three times and failed" the same value,
          # and the consequence was not cosmetic: cache.json holds the memory
          # of what we have already announced, so a lost push means the next
          # run re-detects the same change and pushes a second notification
          # for it. Fail here instead - the notify step is gated on this.
          for i in 1 2 3; do
            git fetch origin main || true
            git merge -X ours --no-edit origin/main || git merge --abort || true
            if git push; then
              echo "pushed"
              exit 0
            fi
            sleep 5
          done
          echo "::error::could not push after 3 attempts - status.json and cache.json were NOT published"
          exit 1

      - name: Verify the committed JSON is readable
        # A file that parses locally can still be corrupted by a bad merge.
        # Catch that here rather than from a user reporting a blank page.
        run: |
          python3 -c "import json; json.load(open('status.json')); print('status.json parses')"

      - name: Notify subscribers of any change
        # FAILS THE JOB when a notification does not go out. It runs after
        # the commit, so status.json is already published and a failure here
        # cannot hold it back - but it used to only warn, and a warning in a
        # green run is something nobody reads. This step once crashed on its
        # first line for days and every notification it should have sent was
        # simply never sent. A red run is emailed.
        #
        # Gated on the publish actually happening. `always()` alone meant a
        # run whose sanity check REFUSED to publish still notified
        # subscribers from the file it had just refused, and a run whose push
        # failed notified without persisting cache.json — so the next run
        # announced the same change again. Only announce what was published.
        id: notify
        if: always() && steps.sanity.outcome == 'success' && steps.commit.outcome == 'success'
        env:
          NOTIFY_URL: ${{ vars.NOTIFY_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, socket, time, urllib.request, urllib.error

          url = os.environ.get("NOTIFY_URL")
          secret = os.environ.get("NOTIFY_SECRET")
          if not url or not secret:
              # Not configured means no subscriber hears anything, ever.
              print("::error::NOTIFY_URL / NOTIFY_SECRET not set - no push notifications are being sent")
              raise SystemExit(1)

          try:
              s = json.load(open("status.json"))
          except Exception as e:
              print(f"::error::status.json unreadable ({e}) - could not notify")
              raise SystemExit(1)

          # A national proclamation lowers flags in every state at once, so
          # every state's "changed" flag flips together. That is ONE event,
          # not 51 — send a single broadcast on the "US" channel, which the
          # Worker fans out to all subscribers.
          # run.py decides whether a national order is NEW, because it
          # writes cache.json before the commit step and so its memory
          # actually persists between runs. This step just obeys.
          # "changed" means the answer moved between half and full (run.py).
          # A move to "unknown" is never pushed: the service worker would
          # have rendered it as "back to full staff".
          fed = s.get("federal")
          if fed:
              changed = ["US"] if fed.get("_changed") else []
          else:
              changed = [c for c, v in s["states"].items()
                         if v.get("changed")
                         and v.get("effective_status") in ("half", "full")]

          if not changed:
              print("No changes this run - nothing to notify.")
              raise SystemExit(0)

          def reported_failures(body):
              """Failures the Worker reports inside a 200: a fan-out that
              reached only some subscribers is not a success."""
              try:
                  d = json.loads(body)
              except Exception:
                  return None
              if not isinstance(d, dict):
                  return None
              for k in ("failed", "failures", "errors"):
                  v = d.get(k)
                  if (isinstance(v, int) and v > 0) or (isinstance(v, list) and v):
                      return f"{k}={v if isinstance(v, int) else len(v)}"
              if d.get("ok") is False or d.get("error"):
                  return f"error={d.get('error') or 'ok:false'}"
              return None

          def send(req):
              """One attempt, retried ONLY when the request never reached the
              Worker (no connection). A timeout or an HTTP error may mean it
              did arrive and pushes went out - retrying those could send every
              subscriber the same alert twice, so they fail instead."""
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return r.read().decode(errors="replace"), None
                  except urllib.error.HTTPError as e:
                      return None, f"HTTP {e.code} {e.read().decode(errors='replace')[:200]}"
                  except urllib.error.URLError as e:
                      if isinstance(e.reason, (socket.timeout, TimeoutError)):
                          return None, f"timed out ({e.reason}) - not retried, it may have been delivered"
                      if attempt < 2:
                          time.sleep(5 * (attempt + 1))
                          continue
                      return None, f"could not reach the Worker: {e.reason}"
                  except (socket.timeout, TimeoutError) as e:
                      return None, f"timed out ({e}) - not retried, it may have been delivered"
              return None, "unreachable"

          failed = []
          for code in changed:
              if code == "US":
                  status = "half"
                  reason = (fed or {}).get("reason") or "National half-staff order"
              else:
                  st = s["states"].get(code, {})
                  status = st.get("effective_status", "unknown")
                  reason = st.get("reason")

              payload = json.dumps({
                  "state": code,
                  "status": status,
                  "reason": reason,
                  "url": "https://halfstaffnow.com/",
              }).encode()

              # urllib sends "Python-urllib/3.x" by default, which Cloudflare
              # rejects with 403 before the request reaches the Worker.
              req = urllib.request.Request(
                  url.rstrip("/") + "/notify", data=payload,
                  headers={"Content-Type": "application/json",
                           "Authorization": f"Bearer {secret}",
                           "User-Agent": "halfstaffnow-pipeline/1.0 "
                                         "(+https://halfstaffnow.com)",
                           "Accept": "application/json"})
              body, err = send(req)
              if err is None:
                  err = reported_failures(body)
                  print(code, body)
              if err:
                  print(f"::error::notify failed for {code}: {err}")
                  failed.append(code)

          if failed:
              # Every state was attempted first; one failure must not stop
              # the others going out.
              raise SystemExit(f"notifications failed for {' '.join(failed)} - "
                               f"subscribers to those were NOT told")
          PY

      - name: Email ingest health
        # The Gmail app password is revoked by any Google password change or
        # security event. Ingest then failed quietly behind continue-on-error:
        # every email state went stale while the job stayed green. A rejected
        # login does not fix itself, so it fails the job at once. A network
        # error usually clears by the next run, so it fails only once ingest
        # has not succeeded for a day.
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          try:
              m = json.load(open("email-orders.json"))
          except Exception as e:
              raise SystemExit(f"::error::email-orders.json unreadable ({e})")
          if m.get("skipped"):
              print("::warning::Email ingest not configured (MAIL_USER/MAIL_PASS not set)")
              raise SystemExit(0)
          err = m.get("ingest_error") or {}
          if err.get("kind") == "auth":
              raise SystemExit("::error::Gmail REJECTED the login for the alerts inbox - the app "
                               "password was probably revoked. Every email state is going stale. "
                               f"Create a new app password and update MAIL_PASS. ({err.get('detail')})")
          gen = m.get("generated_at")
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(gen)) if gen else None
          if age is None or age > timedelta(days=1):
              raise SystemExit("::error::Email ingest has not succeeded for "
                               + (f"{age.days}d {age.seconds // 3600}h" if age else "an unknown time")
                               + f" - email states are going stale. Last error: {err.get('detail') or 'none recorded'}")
          if err:
              print(f"::warning::Email ingest failed this run ({err.get('detail')}); last success {gen}")
          else:
              print(f"Email ingest OK (last success {gen})")
          PY

      - name: History invariants
        # Replays history.jsonl: no state shown half-staff outside its order's
        # stated window, no state changing more than twice a day. Runs AFTER
        # publishing and fails the job (red, emailed) rather than blocking
        # it — a violation means something already reached users, and holding
        # back status.json would not undo that.
        if: always()
        run: python3 test-history.py

      - name: Warn about failing sources
        if: always()
        env:
          MAIL_OUTCOME: ${{ steps.mail.outcome }}
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          # continue-on-error steps report success even when they fail.
          # Their real outcome is only visible here.
          # (Notify is not listed: it now fails the job itself.)
          for step, var in (("Read notification emails", "MAIL_OUTCOME"),
                            ("Rendered pages - render", "RENDER_OUTCOME")):
              if os.environ.get(var) == "failure":
                  print(f"::warning::'{step}' FAILED (hidden by continue-on-error) - see its log")
          # A skipped notify is not a quiet run: it means nothing was
          # published, so any real change this run went unannounced.
          if os.environ.get("NOTIFY_OUTCOME") == "skipped":
              print("::warning::Notify was SKIPPED because this run did not publish - "
                    "any status change it found was not announced")
          # A state bulletin dropped for failing DKIM is either a forgery or a
          # real channel we have stopped reading. Either way a human must look.
          try:
              mail = json.load(open('email-orders.json'))
              if mail.get('skipped'):
                  print("::warning::Email ingest skipped (MAIL_USER/MAIL_PASS not set)")
              for code, e in (mail.get('unauthenticated_senders') or {}).items():
                  print(f"::warning::{e['count']} flag bulletin(s) for {code} FAILED DKIM and were dropped: "
                        f"{(e.get('subjects') or [''])[0]}")
          except Exception:
              pass
          try:
              s = json.load(open('status.json'))
          except Exception:
              print("::warning::status.json unreadable")
              raise SystemExit(0)
          if str(s.get('federal_check', '')).startswith('failed'):
              print(f"::warning::Federal proclamation check {s['federal_check']}")
          st = s['states']
          # Only a registry "no verified source" is an expected error. A 403
          # on a state we are supposed to read is a failure even though the
          # state shows as not_covered — excluding not_covered hid KS, MA, NY.
          bad = [c for c, v in st.items() if v.get('error')
                 and 'no verified source' not in v['error']]
          if bad:
              print(f"::warning::Sources with errors: {' '.join(sorted(bad))}")
          stale_half = [c for c, v in st.items() if v.get('stale_half_claim')]
          if stale_half:
              print(f"::warning::Page says half-staff with no recent order (withheld): {' '.join(sorted(stale_half))}")
          for label, cov in (("Serving stale data for", "stale"),
                             ("Frozen sources (not trusted)", "frozen")):
              hit = [c for c, v in st.items() if v.get('coverage') == cov]
              if hit:
                  print(f"::warning::{label}: {' '.join(sorted(hit))}")
          PY
